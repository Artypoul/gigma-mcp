name: Validate ChatGPT plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check bundled sources
        run: python sync_plugin_docs.py --check
      - name: Validate plugin
        run: python validate_plugin.py
      - name: Run package and transport tests
        run: python -m unittest discover -s tests -v
      - name: Build portable ChatGPT package
        run: python build_chatgpt_package.py
      - name: Install pinned Codex client
        run: npm install --prefix "$RUNNER_TEMP/gigma-codex" --no-audit --no-fund @openai/codex@0.170.0
      - name: Verify MCP registration with the real client
        run: |
          python check_client_registration.py \
            --codex "$RUNNER_TEMP/gigma-codex/node_modules/.bin/codex" \
            --archive dist/gigma-mcp-*-chatgpt.zip \
            --regression-check
      - name: Upload installable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gigma-mcp-chatgpt
          path: dist/gigma-mcp-*-chatgpt.zip
          if-no-files-found: error
